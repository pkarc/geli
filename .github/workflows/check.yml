name: check

# The cheap gate, on everything. No VM: every test in this repo runs on a pure function, which
# is the whole reason the guest's configuration is generated by pure functions in the first place.
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - run: cargo build --locked
      - run: cargo test --locked

      # A new recipe is one TOML file, so nothing in Rust changes and nothing obvious breaks.
      # These are the tests that actually read `agents/*.toml`: that it parses, that the binary
      # and credentials are declared, that it is not asking for `.ssh`, and that its credential
      # paths do not reach into the agent's conversation history.
      - name: Recipe gates
        run: >
          cargo test --locked --
          recipes_asking_for_secrets_are_flagged
          agents_declare_only_their_own_credentials
          layer_recipe

      - run: cargo clippy --locked --all-targets -- -D warnings

      # The downloaded image's name is spelled in two places that have to agree, or `--build-image`
      # looks for a file setup.sh never fetched.
      - name: setup.sh and the binary agree on the cloud image
        run: |
          from_source=$(grep -oP 'CLOUD_IMAGE_NAME: &str = "\K[^"]+' src/qemu.rs)
          from_setup=$(grep -oP '^IMG_NAME="\K[^"]+' setup.sh)
          echo "src/qemu.rs: $from_source"
          echo "setup.sh:    $from_setup"
          test "$from_source" = "$from_setup"
