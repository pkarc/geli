command = "agy"
binary = "agy"
label = "Google account credentials"
# Copied verbatim out of the user's home, and named in the status block for that reason.
# Settings, trusted folders and onboarding state are NOT here: geli builds those from this
# sandbox's own workspace (see `seed_files`), so they carry no host state and are not credentials.
credentials = [
  ".gemini/antigravity-cli/antigravity-oauth-token",
  ".gemini/antigravity-cli/installation_id",
  ".gemini/google_accounts.json",
  ".gemini/oauth_creds.json",
  ".gemini/installation_id",
]
hosts = [
  "antigravity.google",
  "generativelanguage.googleapis.com",
  "oauth2.googleapis.com",
  "accounts.google.com",
  "cloudcode-pa.googleapis.com",
  "daily-cloudcode-pa.googleapis.com",
  "aicode.googleapis.com",
  "aiplatform.googleapis.com",
]
install = '''
retry sh -c 'curl -fsSL --compressed https://antigravity.google/cli/install.sh -o /tmp/agy.sh' \
  && HOME=/root bash /tmp/agy.sh \
  && install -m 0755 /root/.local/bin/agy /usr/local/bin/agy \
  && rm -f /tmp/agy.sh'''
